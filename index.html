<style>
:root{
  --green:#4f46e5; --green-d:#4338ca; --gold:#14b8a6; --gold-d:#0d9488;
  --red:#e11d48; --amber:#d97706; --ok:#0d9488;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f4f6fb; --card:#ffffff;
  --shadow:0 2px 4px rgba(15,23,42,.05),0 1px 2px rgba(15,23,42,.08);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:var(--green)}
.app{max-width:1080px;margin:0 auto;padding:0 18px 90px}
header.top{background:linear-gradient(120deg,var(--green),var(--green-d));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 22px 16px;border-radius:0 0 16px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.logo{width:42px;height:42px;border-radius:10px;overflow:hidden;flex-shrink:0;line-height:0}
.brand h1{margin:0;font-size:20px;letter-spacing:.3px}
.brand p{margin:2px 0 0;font-size:12px;opacity:.85}
#installBtn{margin-left:auto;background:var(--gold);color:#1d2733;border:none;padding:9px 14px;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;display:none}
nav.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:9px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s}
nav.tabs button:hover{border-color:var(--green)}
nav.tabs button.active{background:var(--green);color:#fff;border-color:var(--green)}
nav.tabs button:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
.card h2{margin:0 0 4px;font-size:18px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.col{flex:1;min-width:220px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:8px;border:none;background:var(--green);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.btn:hover{background:var(--green-d)}
.btn.gold{background:var(--gold);color:#1d2733}.btn.gold:hover{background:var(--gold-d)}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--green)}
.btn.ghost:hover{background:#eef2ff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.3px}
.pill.green{background:#ccfbf1;color:var(--ok)}
.pill.amber{background:#fef3c7;color:#b45309}
.pill.red{background:#ffe4e6;color:var(--red)}
.pill.grey{background:#eef1f5;color:var(--muted)}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
/* Side-by-side reading layout: passage stays visible while the questions scroll. */
.readtest{display:flex;gap:16px;align-items:flex-start;margin:8px 0 14px}
.rt-passage{flex:0 0 42%;background:#f3f4ff;border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:56px;max-height:calc(100vh - 96px);overflow:auto}
.rt-passage h3{margin:0 0 6px;font-size:15px}
.rt-passage .rt-text{font-size:14px;line-height:1.8}
.rt-questions{flex:1 1 auto;min-width:0}
@media(max-width:820px){
  .readtest{flex-direction:column;gap:10px}
  .rt-passage{flex:none;width:auto;position:sticky;top:44px;max-height:42vh;box-shadow:0 4px 10px rgba(0,0,0,.06)}
}
.q .meta{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.q .stem{font-size:15px;font-weight:600;margin-bottom:12px}
.opt{display:block;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:.12s}
.opt:hover{border-color:var(--green);background:#f3f4ff}
.opt input{width:auto;margin-right:10px}
.opt.sel{border-color:var(--green);background:#eef2ff}
.bar{height:10px;border-radius:6px;background:#eef1f5;overflow:hidden}
.bar > span{display:block;height:100%;border-radius:6px;background:var(--green)}
.kpi{display:flex;gap:14px;flex-wrap:wrap}
.kpi .box{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
.kpi .box .n{font-size:26px;font-weight:800}
.kpi .box .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.skillrow td{vertical-align:middle}
.muted{color:var(--muted)}
.center{text-align:center}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:10px}
.folder{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.folder .fh{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;cursor:pointer;background:#fafbfc}
.folder .fh:hover{background:#f3f6f9}
.folder .fh .ft{font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px}
.folder .body{padding:6px 16px 14px;display:none}
.folder.open .body{display:block}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:none}
.task input{width:auto;margin-top:3px}
.task .tt{font-size:14px}
.task .ts{font-size:12px;color:var(--muted)}
.chartwrap{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 0;border-bottom:1px solid var(--line)}
.chartwrap .colbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.chartwrap .colbar .vb{width:70%;background:var(--green);border-radius:6px 6px 0 0;transition:.4s;min-height:2px}
.chartwrap .colbar .vb.plan{background:var(--gold)}
.legend{display:flex;gap:16px;font-size:12px;margin-top:10px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.notice{background:#fff8e8;border:1px solid #f0e2b8;border-radius:10px;padding:12px 14px;font-size:13px;color:#7a5d00;margin-bottom:16px}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tag{font-size:11px;background:#eef1f5;color:var(--muted);padding:2px 8px;border-radius:6px;font-weight:700}
.termtag{font-size:10px;background:#eef2ff;color:var(--green);border:1px solid #cbd5e1;padding:1px 6px;border-radius:5px;font-weight:700;margin-right:6px}
.subj{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.3px;border:1px solid transparent}
.subj.eng{background:#f3e8ff;color:#6d28d9;border-color:#e4d4fb}
.subj.math{background:#fff1e6;color:#c2410c;border-color:#fcd9bf}
.print-only{display:none}
#exModal .ovl{position:fixed;inset:0;background:rgba(16,24,40,.55);display:flex;align-items:flex-start;justify-content:center;padding:20px;z-index:300;overflow:auto}
#exModal .ex{background:#fff;max-width:780px;width:100%;border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.28);padding:22px;margin:auto}
.exq{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.opt.exok{border-color:var(--ok);background:#ccfbf1}
.opt.exbad{border-color:var(--red);background:#ffe4e6}
@media print{nav.tabs,header.top .brand p,#installBtn,.no-print{display:none!important}.app{padding:0}.print-only{display:block}}
</style>
</head>

<script>
/* ============================================================
   MASAR — app logic; curriculum lives in curriculum.js.
   ============================================================ */
if (typeof CURRICULUM === "undefined") { window.CURRICULUM = {}; }
if (typeof WRITING_PROMPTS === "undefined") { var WRITING_PROMPTS = {}; }

const GRADES = [
  {id:"3",label:"Grade 3"},{id:"4",label:"Grade 4"},
  {id:"5",label:"Grade 5"},
  {id:"6",label:"Grade 6"},{id:"7",label:"Grade 7"},{id:"8",label:"Grade 8"},
  {id:"9A",label:"Grade 9 Advanced"},{id:"9G",label:"Grade 9 General"},
  {id:"10A",label:"Grade 10 Advanced"},{id:"10G",label:"Grade 10 General"},
  {id:"11A",label:"Grade 11 Advanced"},{id:"11G",label:"Grade 11 General"},
  {id:"12A",label:"Grade 12 Advanced"},{id:"12G",label:"Grade 12 General"}
];
const ENG_SKILLS = ["Reading","Writing","Vocabulary","Grammar"];
const MATH_SKILLS = ["Number & Operations","Algebra","Geometry","Data & Probability"];
const PHYS_SKILLS = ["Measurement & Units","Motion & Forces","Waves & Sound","Light & Optics"];
const SCI_SKILLS  = ["Life Science","Physical Science","Earth & Space Science","Scientific Inquiry & Technology"];
const CHEM_SKILLS = ["Matter & Atomic Structure","Bonding & Compounds","Reactions & Stoichiometry","States, Solutions & Organic"];
// Subject labels used in headings/exports.
var SUBJ_LABEL={Math:"Maths",Physics:"Physics",Science:"Science",Chemistry:"Chemistry",English:"English"};
var SUBJ_LABEL_LONG={Math:"Mathematics",Physics:"Physics",Science:"Science",Chemistry:"Chemistry",English:"English"};
function subjLabel(s){ return SUBJ_LABEL[s]||"English"; }
function subjLabelLong(s){ return SUBJ_LABEL_LONG[s]||"English"; }
// Preset classes/sections for the Create-a-class chooser. Each maps to a diagnostic grade (GRADES id).
const CLASS_PRESETS = [
  {label:"Grade 3/1",grade:"3"},{label:"Grade 3/2",grade:"3"},{label:"Grade 3/3",grade:"3"},
  {label:"Grade 4/1",grade:"4"},{label:"Grade 4/2",grade:"4"},{label:"Grade 4/3",grade:"4"},
  {label:"Grade 5/1",grade:"5"},{label:"Grade 5/2",grade:"5"},{label:"Grade 5/3",grade:"5"},
  {label:"Grade 6/1",grade:"6"},{label:"Grade 6/2",grade:"6"},{label:"Grade 6/3",grade:"6"},
  {label:"Grade 7/1",grade:"7"},{label:"Grade 7/2",grade:"7"},{label:"Grade 7/3",grade:"7"},
  {label:"Grade 8/1",grade:"8"},{label:"Grade 8/2",grade:"8"},{label:"Grade 8/3",grade:"8"},
  {label:"Grade 9 General",grade:"9G"},{label:"Grade 9 Advanced",grade:"9A"},
  {label:"Grade 10 General",grade:"10G"},{label:"Grade 10 Advanced",grade:"10A"},
  {label:"Grade 11 General",grade:"11G"},{label:"Grade 11 Advanced",grade:"11A"},
  {label:"Grade 12 General",grade:"12G"},{label:"Grade 12 Advanced",grade:"12A"}
];
// The grade whose content a class is diagnosed on (the grade BELOW the class, keeping the stream).
// Grade 3 is the floor (no lower content exists), so it is tested on its own grade.
function prevGradeOf(g){
  var map={"4":"3","5":"4","6":"5","7":"6","8":"7","9G":"8","9A":"8","10G":"9G","10A":"9A","11G":"10G","11A":"10A","12G":"11G","12A":"11A"};
  return map[g]||g;
}

if (typeof QUESTION_BANK === "undefined") { var QUESTION_BANK = {}; }
if (typeof QUESTION_BANK_AR === "undefined") { var QUESTION_BANK_AR = {}; }
if (typeof QUESTION_POOL === "undefined") { var QUESTION_POOL = {}; }
var APP_BUILD = "2026-09-10k";  // shown in the header so you can confirm the latest build is running

/* ===== Difficulty-tagged pool assembly (Foundational / Core / Challenge) =====
   Each diagnostic is assembled from a larger tagged pool with a deliberate spread of
   easy/medium/hard items, so the test can separate low, medium and high achievers.
   Deterministic per student so the same test is shown every time and can be re-marked. */
function _seedRand(seedStr){
  seedStr=String(seedStr||"seed");
  var h=1779033703 ^ seedStr.length;
  for(var i=0;i<seedStr.length;i++){ h=Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h=(h<<13)|(h>>>19); }
  var a=h>>>0;
  return function(){ a|=0; a=(a+0x6D2B79F5)|0; var t=Math.imul(a ^ (a>>>15), 1|a); t=(t + Math.imul(t ^ (t>>>7), 61|t)) ^ t; return ((t ^ (t>>>14))>>>0)/4294967296; };
}
function _shuffleSeeded(arr,rand){ arr=arr.slice(); for(var i=arr.length-1;i>0;i--){ var j=Math.floor(rand()*(i+1)); var t=arr[i];arr[i]=arr[j];arr[j]=t; } return arr; }
// The generation "nonce" makes each newly-generated diagnostic different (no repeats), even for the same class/term.
function diagSeed(email,grade,subj,term,nonce){ return (email||"anon")+"|"+grade+"|"+subj+"|"+(term||"1")+"|v"+(nonce||0); }
/* ===== Parametric Maths: fresh numbers every time, so Maths diagnostics never repeat ===== */
function pmRi(r,a,b){ return a+Math.floor(r()*(b-a+1)); }
function pmPick(r,a){ return a[Math.floor(r()*a.length)]; }
function pmGcd(a,b){ a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a||1; }
function pmNear(n){ var out=[];[1,2,3,5,10,4,7].forEach(function(d){[n+d,n-d].forEach(function(c){if(c!==n&&out.indexOf(c)<0)out.push(c);});});return out; }
function pmMkOpts(r,correct,distr){ var out=[String(correct)],seen={};seen[String(correct)]=1;for(var i=0;i<distr.length&&out.length<4;i++){var s=String(distr[i]);while(seen[s]){var x=parseInt(s,10);s=isNaN(x)?s+"'":String(x+1);}seen[s]=1;out.push(s);}while(out.length<4){var s2=String(pmRi(r,2,99));if(!seen[s2]){seen[s2]=1;out.push(s2);}}var cs=out[0];for(var k=out.length-1;k>0;k--){var j=Math.floor(r()*(k+1));var t=out[k];out[k]=out[j];out[j]=t;}return {options:out,answer:out.indexOf(cs)}; }
function pmItem(skill,level,sub,q,correct,distr,r){ var o=pmMkOpts(r,correct,distr);return {skill:skill,level:level,sub:sub,q:q,options:o.options,answer:o.answer}; }
function pmNoMakers(b,r){ var NO="Number & Operations",L=[];
  if(b<=4){
    L.push(function(){var a=pmRi(r,2,9),c=pmRi(r,2,9);return pmItem(NO,"F","Addition","What is "+a+" + "+c+"?",a+c,pmNear(a+c),r);});
    L.push(function(){var a=pmRi(r,6,18),c=pmRi(r,2,5);return pmItem(NO,"F","Subtraction","What is "+a+" - "+c+"?",a-c,pmNear(a-c),r);});
    L.push(function(){var a=pmRi(r,2,5),c=pmRi(r,2,5);return pmItem(NO,"F","Multiplication","What is "+a+" x "+c+"?",a*c,pmNear(a*c),r);});
    L.push(function(){var a=pmRi(r,120,480),c=pmRi(r,110,320);return pmItem(NO,"C","Addition","What is "+a+" + "+c+"?",a+c,pmNear(a+c),r);});
    L.push(function(){var a=pmRi(r,2,9),c=pmRi(r,2,6);return pmItem(NO,"C","Multiplication","A box has "+a+" pens. "+c+" boxes. How many pens?",a*c,pmNear(a*c),r);});
    L.push(function(){var g=pmPick(r,[2,3,4]),e=pmRi(r,3,8);return pmItem(NO,"C","Division",(g*e)+" apples in "+g+" equal groups. How many in each group?",e,pmNear(e),r);});
    L.push(function(){var a=pmRi(r,300,700),c=pmRi(r,150,290);return pmItem(NO,"H","Addition","Ali has "+a+" dirhams. He spends "+c+", then gets 50. How much now?",a-c+50,pmNear(a-c+50),r);});
  } else if(b<=7){
    L.push(function(){var a=pmRi(r,14,40),c=pmRi(r,5,15);return pmItem(NO,"F","Addition","What is "+a+" + "+c+"?",a+c,pmNear(a+c),r);});
    L.push(function(){var a=pmRi(r,20,60),c=pmRi(r,6,18);return pmItem(NO,"F","Subtraction","What is "+a+" - "+c+"?",a-c,pmNear(a-c),r);});
    L.push(function(){var a=pmRi(r,4,12),c=pmRi(r,3,9);return pmItem(NO,"F","Multiplication","What is "+a+" x "+c+"?",a*c,pmNear(a*c),r);});
    L.push(function(){var p=pmPick(r,[10,20,25,50,75]),bs=pmPick(r,[40,60,80,120,160,200,240]);return pmItem(NO,"C","Percentages","What is "+p+"% of "+bs+"?",p*bs/100,pmNear(p*bs/100),r);});
    L.push(function(){var p=pmRi(r,1,4),q=pmRi(r,5,9),g2=pmRi(r,2,4);return pmItem(NO,"C","Fractions","Write "+(p*g2)+"/"+(q*g2)+" in its simplest form.",p+"/"+q,[(p*g2)+"/"+q,p+"/"+(q*g2),(p+1)+"/"+q],r);});
    L.push(function(){var base=pmPick(r,[200,400,600]),p=pmPick(r,[15,30,40]);return pmItem(NO,"H","Percentages","A jacket is "+base+" dirhams. "+p+"% off. How much do you save?",base*p/100,pmNear(base*p/100),r);});
    L.push(function(){var a=pmRi(r,2,5);return pmItem(NO,"H","Powers","What is "+a+" cubed? ("+a+" x "+a+" x "+a+")",a*a*a,pmNear(a*a*a),r);});
  } else if(b<=8){
    L.push(function(){var p=pmPick(r,[10,20,25,50]),bs=pmPick(r,[40,80,120,200]);return pmItem(NO,"F","Percentages","What is "+p+"% of "+bs+"?",p*bs/100,pmNear(p*bs/100),r);});

function buildProbe(a){
  var subj=a.subject||"English", grade=a.prevGrade;
  var weakSub=weakSubsFromAssignment(a), weakSk=weakSkillsFromAssignment(a);
  var prefer=(QUESTION_POOL[grade]&&QUESTION_POOL[grade][subj])?QUESTION_POOL[grade][subj]:[];
  var all=[]; for(var g in QUESTION_POOL){ var arr=QUESTION_POOL[g]&&QUESTION_POOL[g][subj]; if(arr) all=all.concat(arr); }
  function K(q){ return q.skill+"|"+q.sub; }
  var seen={}, out=[];
  function add(list,test){ list.forEach(function(q){ if(out.length>=10)return; if(seen[q.q])return; if(test(q)){ seen[q.q]=1; out.push({q:q.q,options:q.options.slice(),answer:q.answer,skill:q.skill,sub:q.sub}); } }); }
  add(prefer,function(q){return weakSub[K(q)];});     // this grade, exact weak sub-skills
  add(all,function(q){return weakSub[K(q)];});         // any grade, weak sub-skills
  add(prefer,function(q){return weakSk[q.skill];});    // this grade, weak skills
  add(all,function(q){return weakSk[q.skill];});       // any grade, weak skills
  add(prefer,function(){return true;});                // top up with any this-grade
  add(all,function(){return true;});
  return out.slice(0,10);
}

function probeTrendSvg(a){

  if(base!=null) pts.push({label:"Baseline",v:base});
  (a.rtiProbes||[]).forEach(function(p,i){ pts.push({label:"#"+(i+1),v:p.score}); });
  if(pts.length<2) return "";
  var W=460,H=140,padL=28,padB=20,padT=10,goal=70;
  var n=pts.length, xw=(W-padL-10)/(n-1);
  function X(i){ return padL+i*xw; } function Y(v){ return padT+(100-v)/100*(H-padT-padB); }
  var line=pts.map(function(p,i){ return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1); }).join(" ");
  var dots=pts.map(function(p,i){ return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.5" fill="#4f46e5"></circle><text x="'+X(i).toFixed(1)+'" y="'+(Y(p.v)-7).toFixed(1)+'" font-size="9" text-anchor="middle" fill="#334155">'+p.v+'</text>'; }).join("");
  var gy=Y(goal).toFixed(1);

    +'<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-10)+'" y2="'+gy+'" stroke="#16a34a" stroke-dasharray="4 4" stroke-width="1"></line>'
    +'<text x="'+(W-12)+'" y="'+(gy-4)+'" font-size="9" text-anchor="end" fill="#16a34a">goal '+goal+'%</text>'
    +'<path d="'+line+'" fill="none" stroke="#4f46e5" stroke-width="2"></path>'+dots

  if(!AUTH) return "auth:"+(S.authMode||"login");
  if(AUTH.blocked && !isAdmin()) return "blocked";
  if(isAdmin() && S.adminSection) return "admin:"+S.adminSection;
  if(AUTH.role==="teacher" && !VIEWING) return "t:"+(S.teacherView||"")+":"+(S.openClassId||"")+":"+(S.classTerm||"");
  return "s:"+(VIEWING?("v"+(VIEWING.email||VIEWING.studentName||"")):"me")+":"+(S.activeTab||"");
}
function _scrollTopIfViewChanged(){ var k=_viewKey(); if(k!==_lastViewKey){ _lastViewKey=k; try{ _scrollTopIfViewChanged(); }catch(_){} } }
function render(){
  const chip=document.getElementById("userChip");
  if(chip){ chip.innerHTML = AUTH?(`<span class="pill ${AUTH.role==='teacher'?'amber':'green'}">${AUTH.role==='teacher'?'Teacher':'Student'}</span><span style="color:#fff;font-size:13px;font-weight:600">${(AUTH.name||'').split(' ')[0]}</span>`+(isAdmin()?`<button class="btn ghost sm" onclick="setAdmin('reports')">··· Admin ▾</button>`:``)+`<button class="btn gold sm" onclick="openUserGuide()">📖 User Guide</button><button class="btn ghost sm" onclick="logout()">Log out</button><span class="muted" style="font-size:10px;margin-left:6px" title="App build">build ${APP_BUILD}</span>`):""; }
  const tabsEl=document.getElementById("tabs"); const v=document.getElementById("view");
  if(!AUTH){ tabsEl.innerHTML=""; v.innerHTML=viewAuth(); _scrollTopIfViewChanged(); return; }
  if(AUTH.blocked && !isAdmin()){ tabsEl.innerHTML=""; v.innerHTML=blockedView(); _scrollTopIfViewChanged(); return; }
  if(isAdmin() && S.adminSection){ tabsEl.innerHTML=""; v.innerHTML=viewAdmin(); _scrollTopIfViewChanged(); return; }
  if(AUTH.role==="teacher" && !VIEWING){ tabsEl.innerHTML=""; var tnav=teacherNav(); var tbody=(S.teacherView==="analysis")?viewAnalysis():(S.teacherView==="bank")?viewQuestionBank():(S.openClassId?viewClass(S.openClassId):viewTeacher()); v.innerHTML=verifyBanner()+tnav+tbody; _scrollTopIfViewChanged(); return; }
  renderTabs();
  const map={home:viewHome,setup:viewSetup,diagnostic:viewDiagnostic,results:viewResults,gaps:viewGaps,report:viewReport,goals:viewGoals,plan:viewPlan,folders:viewFolders,tracker:viewTracker,graphs:viewProgressGraphs,curriculum:viewCurriculum};
  if(!tabEnabled(TABS.find(t=>t.id===S.activeTab))){S.activeTab=VIEWING?"results":"home";}
  let inner=(map[S.activeTab]||viewHome)();
  if(VIEWING) inner=`<div class="notice" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">👁 Viewing <b>${VIEWING.studentName}</b>'s dashboard (read-only) <button class="btn ghost sm" onclick="teacherCloseStudent()">← Back to my dashboard</button></div>`+inner;
  v.innerHTML=verifyBanner()+inner;
  try{
    if(AUTH.role==="student" && !READONLY && S.activeTab==="diagnostic" && S.student && !S.result){ lockdownStart("diagnostic"); }
    else if(LOCK.active && LOCK.context==="diagnostic" && (S.activeTab!=="diagnostic" || S.result)){ lockdownEnd(); }
  }catch(e){}
  _scrollTopIfViewChanged();
}

    <label>School email</label><input id="a_email" type="email" placeholder="name@school.ae"><div style="height:10px"></div>

  </div>`;
}
function setAuthMode(m){S.authMode=m; render();}
function fbErr(e){ const c=(e&&e.code)||""; if(c.indexOf("email-already-in-use")>=0)return "An account with this email already exists — try logging in."; if(c.indexOf("wrong-password")>=0||c.indexOf("invalid-credential")>=0)return "Wrong email or password."; if(c.indexOf("user-not-found")>=0)return "No account found — try registering."; if(c.indexOf("invalid-email")>=0)return "Enter a valid email address."; if(c.indexOf("weak-password")>=0)return "Password too weak (at least 6 characters)."; if(c.indexOf("network")>=0)return "Network error — check your connection."; if(c.indexOf("configuration")>=0||c.indexOf("api-key")>=0)return "App not connected to Firebase yet (check firebase-config.js)."; return (e&&e.message)||"Something went wrong."; }
function doRegister(){
  const role=document.getElementById("a_role").value, name=document.getElementById("a_name").value.trim();
  const email=document.getElementById("a_email").value.trim().toLowerCase(), pass=document.getElementById("a_pass").value;
  const studentId=((document.getElementById("a_sid")||{}).value||"").trim();
  const msg=document.getElementById("authMsg");
  if(!name||!email||!pass){msg.textContent="Please fill in all fields.";return;}
  if(pass.length<8){msg.textContent="Password must be at least 8 characters.";return;}
  msg.textContent="Creating account…";
  fbAuth.createUserWithEmailAndPassword(email,pass)
    .then(cred=>{ try{ cred.user.sendEmailVerification(); }catch(e){} var doc={role:role,name:name,email:email,students:[]}; if(role==="student"&&studentId)doc.studentId=studentId; return db.collection("users").doc(cred.user.uid).set(doc); })
    .catch(e=>{const m=document.getElementById("authMsg"); if(m)m.textContent=fbErr(e);});
}
function saveStudentId(){
  var v=((document.getElementById("my_sid")||{}).value||"").trim();
  var m=document.getElementById("sidMsg");
  if(!v){ if(m){m.style.color="var(--red)";m.textContent="Enter your Student ID.";} return; }
  db.collection("users").doc(AUTH.uid).update({studentId:v}).then(function(){ AUTH.studentId=v; if(m){m.style.color="var(--ok)";m.textContent="Saved ✓";} render(); }).catch(function(e){ if(m){m.style.color="var(--red)";m.textContent=fbErr(e);} });
}
function verifyBanner(){
  try{ var u=fbAuth.currentUser; if(u && !u.emailVerified){ return '<div class="notice" style="background:#fff8e8;border-color:#f0e2b8;color:#7a5d00;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">✉️ Please verify your email — we sent a link to <b>'+(u.email||"")+'</b>. (Check spam too.) <button class="btn ghost sm" onclick="resendVerification()">Resend email</button></div>'; } }catch(e){} return "";
}
function resendVerification(){
  var u=fbAuth.currentUser;
  if(!u){ alert("You're not signed in right now. Please log out and log back in, then try Resend again."); return; }
  if(u.emailVerified){ alert("Good news — your email is already verified ✓"); render(); return; }
  u.sendEmailVerification()
    .then(function(){ alert("Verification email sent to "+(u.email||"your address")+".\n\nCheck your inbox AND your spam/junk folder. It comes from noreply@masar-22cd5.firebaseapp.com."); })
    .catch(function(e){ var c=(e&&e.code)||""; if(c.indexOf("too-many-requests")>=0){ alert("Too many requests just now — please wait a few minutes and try again."); } else { alert("Couldn't send the email: "+((e&&e.message)||e)); } });
}
function exportBackup(){
  try{
    var data={ exportedAt:new Date().toISOString(), teacher:{name:AUTH.name,email:AUTH.email}, classes:classesList(), assignments:assignments() };
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url;
    a.download="adeptly-backup-"+(new Date().toISOString().slice(0,10))+".json";
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }catch(e){ alert("Backup failed: "+e.message); }
}
function doLogin(){
  const email=document.getElementById("a_email").value.trim().toLowerCase(), pass=document.getElementById("a_pass").value;
  const msg=document.getElementById("authMsg"); msg.textContent="Logging in…";
  fbAuth.signInWithEmailAndPassword(email,pass).catch(e=>{const m=document.getElementById("authMsg"); if(m)m.textContent=fbErr(e);});

function logout(){ fbAuth.signOut(); }

/* ===== QUESTION BANK: view by difficulty + edit-a-copy (Phase) ===== */
var LEVEL_NAME={F:"Easy",C:"Medium",H:"Hard"};
function setBank(field,val){ if(field==="grade")S.bankGrade=val; else if(field==="subj")S.bankSubj=val; render(); }
function bankPool(){ var g=S.bankGrade||"6", subj=S.bankSubj||"English"; return (QUESTION_POOL[g]&&QUESTION_POOL[g][subj])?QUESTION_POOL[g][subj]:[]; }
function qItemHtml(q,i,editable){
  var opt=(q.options||[]).map(function(o,oi){ return '<div style="font-size:12px;'+(oi===q.answer?'color:var(--ok);font-weight:700':'')+'">'+(oi===q.answer?'✓ ':'• ')+String(o).replace(/</g,"&lt;")+'</div>'; }).join("");
  return '<div style="border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:7px">'
    +'<div class="flex-between" style="gap:8px"><div style="font-size:13px;font-weight:600">'+String(q.q).replace(/</g,"&lt;")+'</div>'
    +(editable?'<button class="btn ghost sm" style="color:var(--red)" onclick="delEditQ('+i+')">🗑 Delete</button>':'')+'</div>'
    +'<div class="muted" style="font-size:11px;margin:3px 0 5px">'+(q.skill||"")+(q.sub?(" — "+q.sub):"")+' · <span class="pill '+(q.level==="F"?"green":q.level==="C"?"amber":"red")+'" style="font-size:10px">'+(LEVEL_NAME[q.level]||"—")+'</span></div>'
    +opt+'</div>';
}
function viewQuestionBank(){
  var g=S.bankGrade||"6", subj=S.bankSubj||"English";
  var gopts=GRADES.map(function(x){return '<option value="'+x.id+'" '+(g===x.id?"selected":"")+'>'+x.label+'</option>';}).join("");
  var head='<div class="card"><div class="flex-between" style="flex-wrap:wrap;gap:8px"><h2 style="margin:0">🗂 Question bank</h2></div>'
    +'<p class="sub">Every diagnostic question for a grade &amp; subject, grouped Easy → Medium → Hard, with its skill, sub-skill and correct answer. Use “Edit as my own test” to delete or add questions and save a version you can assign to a class.</p>'
    +'<div class="row"><div class="col"><label>Grade</label><select onchange="setBank(\'grade\',this.value)">'+gopts+'</select></div>'
    +'<div class="col"><label>Subject</label><select onchange="setBank(\'subj\',this.value)"><option value="English" '+(subj==="English"?"selected":"")+'>English</option><option value="Math" '+(subj==="Math"?"selected":"")+'>Mathematics</option><option value="Physics" '+(subj==="Physics"?"selected":"")+'>Physics</option><option value="Science" '+(subj==="Science"?"selected":"")+'>Science</option><option value="Chemistry" '+(subj==="Chemistry"?"selected":"")+'>Chemistry</option></select></div></div>';
  var pool=bankPool();
  if(S.bankMode==="edit") return head+'</div>'+editorHtml();
  if(!pool.length) return head+'<p class="muted" style="font-size:13px;margin-top:8px">No built-in questions for this grade &amp; subject.</p></div>';
  var byL={F:[],C:[],H:[]}; pool.forEach(function(q){ (byL[q.level]||(byL[q.level]=[])).push(q); });
  var body="";
  ["F","C","H"].forEach(function(lv){ var arr=byL[lv]||[]; if(!arr.length)return;
    body+='<h3 style="font-size:15px;margin:14px 0 6px"><span class="pill '+(lv==="F"?"green":lv==="C"?"amber":"red")+'">'+LEVEL_NAME[lv]+'</span> <span class="muted" style="font-size:12px">('+arr.length+' questions)</span></h3>';
    arr.forEach(function(q){ body+=qItemHtml(q,-1,false); });
  });
  head+='<div style="margin-top:10px"><button class="btn gold" onclick="startBankEdit()">✏️ Edit as my own test</button></div></div>';
  return head+'<div class="card">'+body+'</div>';
}
function startBankEdit(){
  var pool=bankPool();
  S.editQs=pool.map(function(q){ return {q:q.q,options:(q.options||[]).slice(),answer:q.answer,skill:q.skill,sub:q.sub||"",level:q.level||"C"}; });
  S.editTitle=gLabel(S.bankGrade||"6")+" "+(S.bankSubj||"English")+" — edited diagnostic";
  S.bankMode="edit"; render();
}
function cancelBankEdit(){ S.bankMode="view"; S.editQs=null; render(); }
function delEditQ(i){ if(!S.editQs)return; S.editQs.splice(i,1); render(); }
function addEditQ(){
  var q=(document.getElementById("nq_q")||{}).value||"";
  var opts=[0,1,2,3].map(function(k){ return (document.getElementById("nq_o"+k)||{}).value||""; });
  var correct=parseInt((document.getElementById("nq_correct")||{}).value||"0",10);
  var level=(document.getElementById("nq_level")||{}).value||"C";
  var skill=(document.getElementById("nq_skill")||{}).value||"";
  var sub=(document.getElementById("nq_sub")||{}).value||"";
  q=q.trim(); opts=opts.map(function(o){return o.trim();});
  if(!q){ alert("Type the question."); return; }
  if(opts.filter(function(o){return o;}).length<2){ alert("Add at least two answer options."); return; }
  if(!opts[correct]){ alert("The chosen correct option is empty."); return; }
  S.editQs=S.editQs||[]; S.editQs.push({q:q,options:opts,answer:correct,skill:skill,sub:sub,level:level});
  render();
}
function editorHtml(){
  var subj=S.bankSubj||"English", areas=skillsFor(subj);
  var list=(S.editQs||[]).map(function(q,i){ return qItemHtml(q,i,true); }).join("");
  var counts={F:0,C:0,H:0}; (S.editQs||[]).forEach(function(q){ counts[q.level]=(counts[q.level]||0)+1; });
  var skillOpts=areas.map(function(k){return '<option value="'+k+'">'+k+'</option>';}).join("");
  return '<div class="card"><div class="flex-between" style="flex-wrap:wrap;gap:8px"><h2 style="margin:0">✏️ Edit diagnostic</h2>'
    +'<div><button class="btn ghost sm" onclick="cancelBankEdit()">Cancel</button> <button class="btn gold sm" onclick="saveEditedTest()">💾 Save test</button></div></div>'
    +'<div class="row"><div class="col" style="flex:2"><label>Test title</label><input id="editTitle" value="'+String(S.editTitle||"").replace(/"/g,"&quot;")+'" oninput="S.editTitle=this.value"></div>'
    +'<div class="col"><label>Questions</label><div style="padding:8px 0;font-size:13px">'+(S.editQs||[]).length+' total · Easy '+counts.F+' / Medium '+counts.C+' / Hard '+counts.H+'</div></div></div>'
    +'<h3 style="font-size:14px;margin:14px 0 6px">Questions (delete any you don\'t want)</h3>'
    +(list||'<p class="muted" style="font-size:12px">No questions — add some below.</p>')
    +'<h3 style="font-size:14px;margin:16px 0 6px">Add your own question</h3>'
    +'<div style="border:1px solid var(--line);border-radius:10px;padding:12px;background:#f8fafc">'
      +'<label>Question</label><input id="nq_q" placeholder="Type the question">'
      +'<div class="row" style="margin-top:8px"><div class="col"><label>Option A</label><input id="nq_o0"></div><div class="col"><label>Option B</label><input id="nq_o1"></div></div>'
      +'<div class="row" style="margin-top:8px"><div class="col"><label>Option C</label><input id="nq_o2"></div><div class="col"><label>Option D</label><input id="nq_o3"></div></div>'
      +'<div class="row" style="margin-top:8px"><div class="col"><label>Correct answer</label><select id="nq_correct"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></div>'
        +'<div class="col"><label>Difficulty</label><select id="nq_level"><option value="F">Easy</option><option value="C" selected>Medium</option><option value="H">Hard</option></select></div>'
        +'<div class="col"><label>Skill</label><select id="nq_skill">'+skillOpts+'</select></div>'
        +'<div class="col"><label>Sub-skill (optional)</label><input id="nq_sub" placeholder="e.g. Inference"></div></div>'
      +'<div style="margin-top:10px"><button class="btn" onclick="addEditQ()">＋ Add question</button></div>'
    +'</div></div>';
}
function saveEditedTest(){
  var title=(S.editTitle||"").trim(); if(!title){ alert("Give the test a title."); return; }
  var qs=(S.editQs||[]); if(!qs.length){ alert("Add at least one question."); return; }
  var subj=S.bankSubj||"English", grade=S.bankGrade||"6";
  var questions=qs.map(function(q){ return {q:q.q,options:q.options,answer:q.answer,skill:q.skill||"",sub:q.sub||"",level:q.level||"C"}; });
  db.collection("tests").add({teacherUid:AUTH.uid,title:title,subject:subj,grade:grade,questions:questions,source:"edited",createdAt:Date.now()})
    .then(function(){ S.bankMode="view"; S.editQs=null; render(); alert("Saved “"+title+"”. Assign it to a class from a class's page (Diagnostic test selector), or to a single student in My classes → Assign."); })
    .catch(function(e){ alert(fbErr(e)); });
}
// Set (or clear) a class's diagnostic test; copies the chosen test's questions onto the class and pending assignments.
function setClassTest(classId,testId){
  var c=classesList().find(function(x){return x.id===classId;}); if(!c)return;
  var t=testId?teacherTests().find(function(x){return x.id===testId;}):null;
  var upd = t ? {diagTestId:testId,diagTitle:t.title||"Custom test",diagQuestions:t.questions||[]} : {diagTestId:"",diagTitle:"",diagQuestions:[]};
  db.collection("classes").doc(classId).update(upd).catch(function(e){alert(fbErr(e));});
  // apply to pending (not completed) assignments in this class
  assignments().filter(function(a){return a.classId===classId && a.status!=="completed";}).forEach(function(a){
    var u = t ? {customQuestions:t.questions||[],customTitle:t.title||"Custom test"} : {customQuestions:null,customTitle:null};
    db.collection("assignments").doc(a.id).update(u).catch(function(){});
  });
}
// Generate a brand-new version of the class diagnostic (no repeats): bump the generation nonce.
function newDiagnosticVersion(classId){
  var c=classesList().find(function(x){return x.id===classId;}); if(!c)return;
  if(!confirm("Generate a fresh version of this class's diagnostic?\n\nStudents who haven't taken it yet will get all-new questions, text and writing prompt — no repeats from the current version.")) return;
  var next=(c.genNonce||0)+1;
  db.collection("classes").doc(classId).update({genNonce:next}).catch(function(e){alert(fbErr(e));});
  assignments().filter(function(a){return a.classId===classId && a.status!=="completed";}).forEach(function(a){ db.collection("assignments").doc(a.id).update({genNonce:next}).catch(function(){}); });
}
// Named, interactive classroom activities/games (low-prep + a few digital tools) per skill and level.
var SKILL_STRATEGIES={
 "Reading":{support:[
   "<b>Running Dictation</b> — post a short text on the wall; runners read, remember and dictate to a writing partner, then check.",
   "<b>Story Sequencing Cards</b> — students put jumbled sentence strips of a short story in the right order in pairs.",
   "<b>Highlighter Hunt</b> — give a 4–5 line text and race to underline the answer to a literal question ('point to the words').",
   "<b>Kahoot! / Blooket 'True or False'</b> — quick comprehension checks on a mini-text the class just read together."],
   extend:[
   "<b>Jigsaw Reading</b> — each group reads a different short text, then teaches the others and compares ideas.",
   "<b>Reciprocal Reading roles</b> — Predictor, Questioner, Clarifier, Summariser rotate around the group.",
   "<b>Two-text Debate</b> — read two opinions on one topic and argue which is more convincing, using evidence."]},
 "Vocabulary":{support:[
   "<b>Flyswatter Game</b> — words on the board; two students race to swat the word you define.",
   "<b>Pictionary / Charades</b> — act or draw the target word for the team to guess.",
   "<b>Word Wall + Bingo</b> — build a class word wall, then play definition Bingo with those words.",
   "<b>Wordwall.net 'Match up'</b> or <b>Quizlet Live</b> — match words to meanings in teams."],
   extend:[
   "<b>Synonym Ladders</b> — climb from a weak word to a strong one (big → large → enormous).",
   "<b>Vocabulary Journal + Frayer Model</b> — word, meaning, example, non-example, picture.",
   "<b>Taboo</b> — describe a word to your team without saying the 'forbidden' words."]},
 "Grammar":{support:[
   "<b>Sentence Scramble Race</b> — teams reorder cut-up word cards into a correct sentence.",
   "<b>Four Corners</b> — label corners A/B/C/D; students run to the corner with the correct verb form.",
   "<b>Grammar Board Race</b> — two teams race to fix an incorrect sentence on the board.",
   "<b>Kahoot! / Quizizz</b> — fast 'choose the correct word' rounds with instant feedback."],
   extend:[
   "<b>Error Hunt / Find-and-Fix</b> — a paragraph with mixed errors to correct against a checklist.",
   "<b>Sentence Transformation Relay</b> — change tense or active↔passive down the row.",
   "<b>Grammar Auction</b> — teams 'buy' sentences they believe are correct."]},
 "Writing":{support:[
   "<b>Sentence Starters + Paragraph Frame</b> — model, write one together, then students try alone.",

function handleResultsImport(input){

// Combo chart: Adeptly diagnostic as bold BARS, report-card grade as an overlaid line. Big + gridlines + value labels.

  var plotW=W-padL-padR, plotH=H-padT-padB, base=padT+plotH;
  var band=plotW/n;

  [0,25,50,75,100].forEach(function(g){ var y=Y(g); grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="#eef2f6" stroke-width="1"></line>'; yl+='<text x="'+(padL-7)+'" y="'+(y+3.5).toFixed(1)+'" font-size="11" text-anchor="end" fill="#94a3b8">'+g+'</text>'; });

  var d="",started=false; reportVals.forEach(function(v,i){ if(v==null)return; d+=(started?"L":"M")+cx(i).toFixed(1)+" "+Y(v).toFixed(1)+" "; started=true; });
  var line=d?'<path d="'+d.trim()+'" fill="none" stroke="#f59e0b" stroke-width="3"></path>':"";

    +'<span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:16px;height:12px;background:#4f46e5;border-radius:3px"></span> Adeptly diagnostic</span>'
    +'<span style="display:inline-flex;align-items:center;gap:6px"><span style="display:inline-block;width:18px;height:0;border-top:3px solid #f59e0b"></span> Report‑card grade (previous terms)</span></div>';
}
// Find a subject's grade object inside a prior record, tolerant of case + English/Maths aliases.
function _priorSubjObj(prior, subjName, rawSubj){
  if(!prior||!prior.bySubject) return null;
  var bs=prior.bySubject;
  if(bs[subjName]) return bs[subjName];
  if(rawSubj&&bs[rawSubj]) return bs[rawSubj];
  var want=[subjName.toLowerCase()];
  if(subjName==="Maths") want.push("math","maths","mathematics","math.");
  if(subjName==="English") want.push("english","eng","ela","language");
  var keys=Object.keys(bs);
  for(var i=0;i<keys.length;i++){ if(want.indexOf(keys[i].toLowerCase().trim())>=0) return bs[keys[i]]; }
  return null;
}
// Pull one term's value, tolerant of "Term 1" / "1" / "T1" / "term1" / trailing-number keys.
function _priorTermVal(subjObj, termNum){
  if(!subjObj) return null;
  var cands=["Term "+termNum,String(termNum),"T"+termNum,"term "+termNum,"Term"+termNum,"term"+termNum];
  for(var i=0;i<cands.length;i++){ var v=subjObj[cands[i]]; if(v!=null&&!isNaN(v)) return v; }
  var keys=Object.keys(subjObj);
  for(var j=0;j<keys.length;j++){ var m=(""+keys[j]).match(/(\d+)\s*$/); if(m&&m[1]===String(termNum)){ var w=subjObj[keys[j]]; if(w!=null&&!isNaN(w)) return w; } }
  return null;
}

    html+='<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px"><b style="font-size:13px">'+k+'</b>'

  });
  html+='<p class="muted" style="font-size:11px;margin-top:4px">Suggestions are general classroom strategies — adapt them to your students and curriculum.</p></div>';
  return html;
}

/* ============================================================
   LOCKDOWN / ANTI-CHEAT
   - Real lockdown comes from the ClassCurio app hosting Adeptly
     in its webview. Adeptly looks for a window.ClassCurio bridge
     and calls it to start/stop the OS-level lockdown.
   - Soft in-browser measures run regardless (fullscreen, block
     copy/paste/right-click, and flag tab-switching to the teacher).
   ============================================================ */
var LOCK={active:false, leaves:0, handlers:null, context:null, kicked:false, last:0};
var MAX_VIOLATIONS=3;
function ccBridge(){ return (typeof window!=="undefined" && window.ClassCurio) ? window.ClassCurio : null; }
function inClassCurio(){ return !!ccBridge() || /ClassCurio/i.test((typeof navigator!=="undefined"&&navigator.userAgent)||""); }
function ccCall(names){ const b=ccBridge(); if(!b)return false; for(var i=0;i<names.length;i++){ var n=names[i]; if(typeof b[n]==="function"){ try{ b[n](); return true; }catch(e){} } } return false; }
function lockdownStart(context){
  if(LOCK.active) return;
  if(!(AUTH&&AUTH.role==="student")||READONLY) return;
  LOCK.active=true; LOCK.leaves=0; LOCK.kicked=false; LOCK.last=0; LOCK.context=context||"diagnostic";
  ccCall(["startLockdown","start","lock","enterLockdown","enable"]);   // real OS screenshot block + kiosk when inside ClassCurio
  try{ var el=document.documentElement; if(el.requestFullscreen) el.requestFullscreen().catch(function(){}); }catch(e){}
  var block=function(e){ e.preventDefault(); return false; };
  var onLeave=function(){ if(document.hidden){ registerViolation(); } };
  var onBlur=function(){ showScreenGuard(true); registerViolation(); };
  var onFocus=function(){ showScreenGuard(false); };
  var onKey=function(e){ var k=e.key||""; if(k==="PrintScreen" || ((e.metaKey||e.ctrlKey)&&e.shiftKey&&/^[0-9]$/.test(k))){ try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(" "); }catch(_){} registerViolation(); } };
  var onKeyDown=function(e){ var k=(e.key||"").toLowerCase(); if((e.metaKey||e.ctrlKey) && ["c","v","x","a","s","p","u"].indexOf(k)>=0){ try{e.preventDefault();}catch(_){} return false; } };
  document.addEventListener("contextmenu",block,true);
  document.addEventListener("copy",block,true); document.addEventListener("cut",block,true); document.addEventListener("paste",block,true);
  document.addEventListener("visibilitychange",onLeave);
  document.addEventListener("keyup",onKey,true);
  document.addEventListener("keydown",onKeyDown,true);
  window.addEventListener("blur",onBlur);
  window.addEventListener("focus",onFocus);
  LOCK.handlers={block:block,onLeave:onLeave,onBlur:onBlur,onFocus:onFocus,onKey:onKey,onKeyDown:onKeyDown};
  renderLockBadge();
}
function lockdownEnd(){
  if(!LOCK.active) return;
  ccCall(["stopLockdown","stop","unlock","exitLockdown","disable"]);
  var h=LOCK.handlers;
  if(h){ document.removeEventListener("contextmenu",h.block,true); document.removeEventListener("copy",h.block,true); document.removeEventListener("cut",h.block,true); document.removeEventListener("paste",h.block,true); document.removeEventListener("visibilitychange",h.onLeave); document.removeEventListener("keyup",h.onKey,true); document.removeEventListener("keydown",h.onKeyDown,true); window.removeEventListener("blur",h.onBlur); window.removeEventListener("focus",h.onFocus); }
  showScreenGuard(false);
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){}); }catch(e){}
  LOCK.active=false; LOCK.handlers=null; removeLockBadge();
}
function registerViolation(){
  if(!LOCK.active || LOCK.kicked) return;
  var now=Date.now(); if(now-LOCK.last<1200) return;   // one action can fire blur+visibilitychange; count once
  LOCK.last=now; LOCK.leaves++;
  if(AUTH&&AUTH.role==="student"&&S.activeAssignment){ db.collection("assignments").doc(S.activeAssignment).update({leaveCount:LOCK.leaves,lastLeftAt:Date.now()}).catch(function(){}); }
  var b=document.getElementById("lockBadge"); if(b){ var c=b.querySelector(".lk-leaves"); if(c)c.textContent=LOCK.leaves; }
  if(LOCK.context==="diagnostic"){
    if(LOCK.leaves>=MAX_VIOLATIONS){ kickOut(); return; }
    var left=MAX_VIOLATIONS-LOCK.leaves;
    try{ alert("⚠ Warning "+LOCK.leaves+" of "+MAX_VIOLATIONS+"\n\nLeaving the test, switching tabs, or taking a screenshot is not allowed. After "+left+" more, your test will be submitted automatically and you'll be removed."); }catch(e){}
  }
}
function kickOut(){
  if(LOCK.kicked) return;
  LOCK.kicked=true;
  // Force-submit whatever answers exist so the attempt is recorded AND the student
  // is actually removed from the test screen. grade(true) scores unanswered items as
  // incorrect, sets S.result, tears down lockdown, and re-renders to the results view.
  var graded=false;
  try{ if(typeof S!=="undefined" && S.result==null){ grade(true); graded=(S.result!=null); } else if(typeof S!=="undefined" && S.result){ graded=true; } }catch(e){}
  // ALWAYS stamp the removal on the assignment — status "completed" plus the kicked flag —
  // so the teacher sees the student was flagged and can "Allow retake", even if auto-grading
  // couldn't run. Merge, so grade()'s own score/level write (if it ran) is preserved.
  try{
    if(AUTH&&AUTH.role==="student"&&S.activeAssignment){
      var rec={violations:LOCK.leaves,kicked:true,kickedAt:Date.now(),status:"completed",retakeAllowed:false};
      if(!graded){ rec.score=0; rec.level=""; rec.levelCls="grey"; rec.completedAt=Date.now(); }
      db.collection("assignments").doc(S.activeAssignment).set(rec,{merge:true}).catch(function(){});
    }
  }catch(e){}
  lockdownEnd();
  // Fallback: if grading couldn't run for any reason, still eject the student from the
  // test so they can't keep working — leave the diagnostic tab and re-render.
  if(!graded){ try{ S.activeTab="results"; save(); render(); }catch(e){} }
  try{ alert("You left the test screen "+MAX_VIOLATIONS+" times.\n\nFor test integrity, your diagnostic has been ended and submitted. Please ask your teacher if you need to retake it."); }catch(e){}
}
function showScreenGuard(on){
  var id="scrGuard";
  if(on){ if(document.getElementById(id))return; var d=document.createElement("div"); d.id=id;
    d.style.cssText="position:fixed;inset:0;z-index:400;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:24px;flex-direction:column;gap:8px";
    d.innerHTML="🔒 Return to the test window to continue<br><span style=\"font-size:13px;opacity:.85\">Leaving the test is recorded and counts as a violation.</span>";
    document.body.appendChild(d);
  } else { var e=document.getElementById(id); if(e&&e.parentNode)e.parentNode.removeChild(e); }
}
function renderLockBadge(){
  removeLockBadge();
  var d=document.createElement("div"); d.id="lockBadge";
  d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:200;background:#0f172a;color:#fff;font-size:12px;text-align:center;padding:6px 10px;letter-spacing:.3px";
  d.innerHTML="🔒 Secure assessment mode"+(inClassCurio()?" — secure desktop app active":" — stay on this screen")+" · violations: <b class=\"lk-leaves\">0</b> / "+MAX_VIOLATIONS;
  document.body.appendChild(d);
}
function removeLockBadge(){ var b=document.getElementById("lockBadge"); if(b&&b.parentNode)b.parentNode.removeChild(b); }

/* ===== QUICK IMPORT — teacher pastes their own test, app builds it ===== */
function parseImport(text, areas){
  var lines=(text||"").split(/\r?\n/), out=[], warnings=[], cur=null;
  function isOpt(l){ return /^\s*(\*|[\-•]|[A-Za-z][\.\)])\s+/.test(l); }
  var skillRe=/^\s*\[\s*skill\s*:\s*(.+?)\s*\]\s*$/i;
  var ansRe=/^\s*(answer|ans|correct|key)\s*[:\-]\s*(.+?)\s*$/i;
  function setAnswer(q,val){ if(/^[A-Za-z]$/.test(val)){ var idx=val.toUpperCase().charCodeAt(0)-65; if(idx>=0&&idx<q.options.length)q.answer=idx; return; } for(var k=0;k<q.options.length;k++){ if(q.options[k].toLowerCase()===val.toLowerCase()){q.answer=k;return;} } var m=val.match(/^[A-Za-z][\.\)]\s*(.+)$/); if(m)setAnswer(q,m[1].trim()); }
  function finalize(){ if(cur){ if(cur.options.length>=2){ if(cur.answer<0){ cur.answer=0; warnings.push('"'+cur.q.slice(0,32)+'…": no correct option marked with *, used the first option.'); } out.push(cur); } else if(cur.q){ warnings.push('"'+cur.q.slice(0,32)+'…": needs at least 2 options — skipped.'); } } cur=null; }
  for(var i=0;i<lines.length;i++){
    var line=lines[i].replace(/\s+$/,"");
    if(!line.trim()){ continue; }
    var sm=line.match(skillRe);
    if(sm && cur){ cur.skill=sm[1].trim(); continue; }
    var am=line.match(ansRe);
    if(am && cur && cur.options.length){ setAnswer(cur, am[2].trim()); continue; }
    if(cur && isOpt(line)){
      var t=line.trim(), correct=false;
      if(/^\*/.test(t)){ correct=true; t=t.replace(/^\*\s*/,""); }
      else { t=t.replace(/^[\-•]\s*/,"").replace(/^[A-Za-z][\.\)]\s*/,""); }
      if(/\*\s*$/.test(t)){ correct=true; t=t.replace(/\s*\*\s*$/,""); }
      if(/\(\s*correct\s*\)\s*$/i.test(t)){ correct=true; t=t.replace(/\s*\(\s*correct\s*\)\s*$/i,""); }
      var idx=cur.options.length; cur.options.push(t.trim()); if(correct)cur.answer=idx;
      continue;
    }
    finalize();
    var q=line.trim().replace(/^\s*(\d+[\.\)]|Q\s*[:\.\)]?)\s*/i,"");
    cur={q:q, options:[], answer:-1, skill:null};
  }
  finalize();
  for(var j=0;j<out.length;j++){ if(!out[j].skill || areas.indexOf(out[j].skill)<0){ out[j].skill=areas[j%areas.length]; } }
  return {questions:out, warnings:warnings};
}
var IMPORTED=null;
function handleImportFile(input){
  var f=input.files && input.files[0]; if(!f)return;
  var subj=document.getElementById("imp_subject").value;
  var nm=(f.name||"").toLowerCase();
  var prev=document.getElementById("imp_preview"); if(prev) prev.innerHTML='<p class="muted" style="font-size:13px">Reading <b>'+(f.name||"file").replace(/</g,"&lt;")+'</b>…</p>';
  var titleEl=document.getElementById("imp_title"); if(titleEl && !titleEl.value){ titleEl.value=(f.name||"").replace(/\.(pdf|docx?)$/i,""); }
  var fail=function(m){ var p=document.getElementById("imp_preview"); if(p) p.innerHTML='<div class="notice">Could not read this file'+(m?(": "+m):"")+'. Please upload a <b>.pdf</b> or <b>.docx</b> file.</div>'; };
  var reader=new FileReader();
  reader.onerror=function(){ fail("the file could not be opened"); };
  reader.onload=function(){
    var buf=reader.result;
    try{
      if(nm.endsWith(".pdf") || f.type==="application/pdf"){
        extractPdfText(buf).then(function(t){finishImport(t,subj);}).catch(function(e){fail((e&&e.message)||e);});
      } else if(nm.endsWith(".docx")){
        if(typeof mammoth==="undefined"){ fail("the Word reader didn't load — check your internet and try again"); return; }
        mammoth.extractRawText({arrayBuffer:buf}).then(function(r){finishImport((r&&r.value)||"",subj);}).catch(function(e){fail((e&&e.message)||e);});
      } else if(nm.endsWith(".doc")){
        fail("the old .doc format isn't supported — please re-save as .docx or PDF");
      } else { fail("unsupported file type"); }
    }catch(e){ fail((e&&e.message)||e); }
  };
  reader.readAsArrayBuffer(f);
}
function extractPdfText(buf){
  if(typeof pdfjsLib==="undefined") return Promise.reject(new Error("the PDF reader didn't load — check your internet"));
  return pdfjsLib.getDocument({data:buf}).promise.then(function(pdf){
    var pages=[], chain=Promise.resolve();
    for(var p=1;p<=pdf.numPages;p++){ (function(pn){ chain=chain.then(function(){ return pdf.getPage(pn).then(function(pg){ return pg.getTextContent().then(function(tc){ pages.push(reconstructLines(tc.items)); }); }); }); })(p); }
    return chain.then(function(){ return pages.join("\n"); });
  });
}
function reconstructLines(items){
  var rows={};
  items.forEach(function(it){ var y=Math.round((it.transform&&it.transform[5])||0), x=(it.transform&&it.transform[4])||0; (rows[y]=rows[y]||[]).push({x:x,s:it.str||""}); });
  var ys=Object.keys(rows).map(Number).sort(function(a,b){return b-a;});
  return ys.map(function(y){ return rows[y].sort(function(a,b){return a.x-b.x;}).map(function(o){return o.s;}).join(" ").replace(/\s+/g," ").trim(); }).filter(function(l){return l;}).join("\n");
}
function finishImport(text, subj){ IMPORTED=parseImport(text, skillsFor(subj)); IMPORTED.raw=text; renderImportPreview(); }
function reparseImport(subj){ if(IMPORTED && IMPORTED.raw!=null){ finishImport(IMPORTED.raw, subj); } }
function renderImportPreview(){
  var el=document.getElementById("imp_preview"); if(!el)return;
  if(!IMPORTED || !IMPORTED.questions.length){ el.innerHTML='<div class="notice">No questions could be detected in this file. Make sure it follows the format above — one question per line, each option on its own line, and the correct answer marked with a leading <b>*</b> or an <b>Answer:</b> line.</div>'; return; }
  var res=IMPORTED;
  var html='<p style="font-size:13px;margin:0 0 8px"><b>'+res.questions.length+' question(s) detected.</b> Review below, then Save.</p>';

// Rolling nonce for the teacher's preview/PDF so every time they generate a preview they get a
// TOTALLY different paper (not the same fixed nonce-0 test each time). Persisted so it keeps
// advancing across sessions and never repeats a previously generated version.
function pvNonceKey(){ return "masar_pv_nonce_"+(AUTH?AUTH.uid:"anon"); }
function pvNonce(){ var v=parseInt(lsGet(pvNonceKey(),"0"),10); return isNaN(v)?0:v; }
function pvBump(){ var n=pvNonce()+1; lsSet(pvNonceKey(), String(n)); return n; }
function buildDiagnosticData(){
  var subj=(document.getElementById("pv_subject")||{}).value||"English";
  var pvRaw=(document.getElementById("pv_grade")||{}).value||"6";
  var classGrade=(pvRaw.indexOf("|")>=0)?pvRaw.split("|")[0]:pvRaw;
  var grade=prevGradeOf(classGrade);  // preview the exact test students get (the previous grade)
  var testId=(document.getElementById("pv_test")||{}).value||"";
  var ct=testId?teacherTests().find(function(x){return x.id===testId;}):null;
  var qs, passage=null, title;
  if(ct){ qs=ct.questions||[]; subj=ct.subject; grade=ct.grade; title=(ct.title||"Imported test")+" (imported)"; }
  else {
    // Use the SAME engine students get (tagged pool / parametric Maths), so the preview matches the real
    // test. The rolling preview nonce makes each generated preview a totally different paper.
    var pvN=pvNonce();
    var assembled=assembleDiagnostic(grade,subj,diagSeed(AUTH&&AUTH.email,grade,subj,"1",pvN));
    if(subj==="English"){ var rc=readingCompRot(grade,"1",pvN); passage=rc; var cq=rc.qs.map(function(x){return {q:x.q,options:x.options,answer:x.answer,skill:"Reading"};}); qs=assembled?cq.concat(assembled):cq; }
    else { qs=assembled; }
    if(!qs||!qs.length){ var bank=(QUESTION_BANK[grade]&&QUESTION_BANK[grade][subj])?QUESTION_BANK[grade][subj]:null; if(bank) qs=bank; }  // legacy fallback
    title="Diagnostic — "+gLabel(grade)+" "+subjLabelLong(subj);
  }
  return {subj:subj,grade:grade,qs:qs,passage:passage,title:title};
}
function downloadDiagnosticPDF(keepCurrent){
  try{
    // A direct download (from the card) generates a fresh paper each click; the modal's own
    // download button passes keepCurrent=true so the PDF matches the preview on screen.
    if(!keepCurrent) pvBump();
    var d=buildDiagnosticData();
    if(!d.qs||!d.qs.length){ alert("No questions available for this selection yet."); return; }
    var JS=(window.jspdf&&window.jspdf.jsPDF); if(!JS){ alert("The PDF writer didn't load — check your internet and try again."); return; }
    var doc=new JS({unit:"pt",format:"a4"}); var W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight();
    var M=48, x=M, y=M, LW=W-2*M; var LET=["A","B","C","D","E","F"];
    function nl(h){ y+=h; if(y>H-M){ doc.addPage(); y=M; } }
    function wrap(txt,size,style,indent){ doc.setFont("helvetica",style||"normal"); doc.setFontSize(size);
      var lines=doc.splitTextToSize(String(txt),LW-(indent||0)); for(var i=0;i<lines.length;i++){ if(y>H-M){doc.addPage();y=M;} doc.text(lines[i],x+(indent||0),y); y+=size+3; } }
    doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.text("Adeptly",x,y); y+=20;
    wrap(d.title,13,"bold",0); wrap("Name: ______________________________     Class: ____________     Date: __________",10,"normal",0); nl(6);
    doc.setDrawColor(200); doc.line(x,y,x+LW,y); nl(12);
    if(d.passage){ wrap("Reading passage — "+d.passage.title,12,"bold",0); nl(2); wrap(d.passage.passage,11,"normal",0); nl(6);
      wrap("Read the passage, then answer the questions below.",9,"italic",0); nl(10); }
    d.qs.forEach(function(q,i){ wrap("Q"+(i+1)+". "+(q.q||""),11,"bold",0); nl(1);
      (q.options||[]).forEach(function(o,oi){ wrap(LET[oi]+")  "+o,10,"normal",14); }); nl(8); });
    // Writing task (English built-in tests) — a written response, not multiple choice
    var _pdfWp=(d.subj==="English" && d.passage)?writingPromptRot(d.grade,"1",pvNonce()):null;
    if(_pdfWp){
      nl(6); wrap("Writing Task — written response",12,"bold",0); nl(1);
      wrap(_pdfWp,11,"normal",0); nl(3);
      wrap("Write your response on the lines below:",9,"italic",0); nl(8);
      doc.setDrawColor(200);
      for(var wl=0; wl<12; wl++){ if(y>H-M){ doc.addPage(); y=M; } doc.line(x,y,x+LW,y); y+=22; }
    }
    // Answer key (teacher copy) on a fresh page
    doc.addPage(); y=M; x=M;
    doc.setFont("helvetica","bold"); doc.setFontSize(14); doc.text("Answer Key — teacher copy",x,y); y+=22;
    var keyLine=""; d.qs.forEach(function(q,i){ keyLine+="Q"+(i+1)+": "+(LET[q.answer]||"?")+"    "; if((i+1)%6===0){ wrap(keyLine,11,"normal",0); keyLine=""; } });
    if(keyLine) wrap(keyLine,11,"normal",0);
    var fname=("Adeptly diagnostic - "+d.title).replace(/[^a-z0-9 \-]/gi,"").slice(0,80)+".pdf";
    doc.save(fname);
  }catch(e){ alert("Sorry — couldn't build the PDF: "+((e&&e.message)||e)); }
}

/* ===== PROGRESS GRAPHS (per subject: year-by-term + term-by-skill) ===== */
function subjectsForStudent(email){ const set={}; assignments().filter(a=>a.studentEmail===email).forEach(a=>{set[a.subject]=1;}); return Object.keys(set); }
function termAssignmentFor(email,subject,term){
  const cand=assignments().filter(a=>a.studentEmail===email&&a.subject===subject&&aTerm(a)===String(term));
  cand.sort((a,b)=>(b.completedAt||b.createdAt||0)-(a.completedAt||a.createdAt||0));
  return cand.find(a=>a.progress)||cand.find(a=>a.status==="completed")||cand[0]||null;
}
function pgLatestTerm(email,subject){ for(let t=3;t>=1;t--){const a=termAssignmentFor(email,subject,t); if(a&&a.status==="completed")return String(t);} return "1"; }
function setPgTerm(v){ S.pgTerm=v; if(AUTH&&AUTH.role==="student")save(); render(); }
function progressGraphsHTML(email){
  const subs=subjectsForStudent(email);
  if(!subs.length) return `<div class="card"><h2>📊 Progress graphs</h2><p class="muted" style="margin:0">No diagnostics yet, so there's no progress to chart.</p></div>`;
  const order=["English","Math"].filter(s=>subs.indexOf(s)>=0).concat(subs.filter(s=>["English","Math"].indexOf(s)<0));
  return order.map(subject=>{
    const termVals=[1,2,3].map(t=>{const a=termAssignmentFor(email,subject,t);return {t:t,pct:(a&&a.progress)?a.progress.yearPct:0,has:!!(a&&a.status==="completed")};});

    const selTerm=String(S.pgTerm||pgLatestTerm(email,subject));

    } else if(aSel&&((aSel.goals&&aSel.goals.length)||(aSel.status==="completed"))){
      const gs=(aSel.goals&&aSel.goals.length)?aSel.goals:computeGoalsFor(aSel);
      skillBars=gs.length?gs.map(g=>`<div style="margin-bottom:11px"><div class="flex-between" style="font-size:12px"><span><b>${g.skill}</b> <span class="muted">target ${g.t3}%</span></span><span class="muted">0%</span></div><div class="bar"><span style="width:0%"></span></div></div>`).join(""):`<p class="muted" style="font-size:13px">No targeted goals this term.</p>`;
    } else {
      skillBars=`<p class="muted" style="font-size:13px">Term ${selTerm} hasn't been completed yet — no goal progress to show.</p>`;
    }
    const termSel=`<select style="width:auto;display:inline-block" onchange="setPgTerm(this.value)">${[1,2,3].map(t=>`<option value="${t}" ${selTerm===String(t)?"selected":""}>Term ${t}</option>`).join("")}</select>`;

      <h3 style="font-size:14px;margin:12px 0 2px">Year progress — completion by term</h3>

      ${yearBars}
      <div class="flex-between" style="margin:20px 0 2px"><h3 style="font-size:14px;margin:0">Term progress — by targeted goal &amp; skill</h3><div><label style="display:inline;margin-right:6px">Term</label>${termSel}</div></div>
      <p class="sub">Progress on each targeted skill's activities within the selected term.</p>

/* ============================================================
   CLASSES — a teacher gives one diagnostic to a whole class;
   Adeptly auto-filters low achievers and builds goals,
   comparative analysis and activities for each.
   ============================================================ */
function genCode(){var c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<6;i++)s+=c.charAt(Math.floor(Math.random()*c.length));return s;}
function classMembers(id){ const seen={},out=[]; assignments().filter(a=>a.classId===id).forEach(a=>{ if(!seen[a.studentEmail]){seen[a.studentEmail]=1; out.push({email:a.studentEmail,name:a.studentName});} }); return out; }
function priorSummaryFor(email,classId,term){
  const pt=Number(term)-1; if(pt<1) return null;
  const p=assignments().find(a=>a.classId===classId&&a.studentEmail===email&&aTerm(a)===String(pt)&&a.status==="completed");
  if(!p) return null;
  return {term:String(pt),score:p.score,level:p.level||"",skillPct:p.skillPct||{},goals:p.goals||[]};
}
function generateTerm(classId,term){
  const c=classesList().find(x=>x.id===classId); if(!c)return;
  const t=String(term);
  const members=classMembers(classId);
  if(!members.length){ alert("No students have joined this class yet. Share the join code (Term 1 is created when a student joins), then generate later terms."); return; }
  const pending=members.filter(m=>!assignments().find(a=>a.classId===classId&&a.studentEmail===m.email&&aTerm(a)===t));
  if(!pending.length){ alert("Every enrolled student already has the Term "+t+" diagnostic."); return; }
  if(!confirm("Generate the Term "+t+" diagnostic for "+pending.length+" student(s)?"+(Number(t)>1?" It will build on each student's Term "+(Number(t)-1)+" results.":""))) return;
  const td=c.termDates||{};
  // Advance the class version every time we generate, so each generation is a TOTALLY different
  // paper from the last (never the same test for the same class again). Persist it so the next
  // generation moves on again.
  const freshNonce=(c.genNonce||0)+1;
  db.collection("classes").doc(classId).update({genNonce:freshNonce}).catch(function(){});
  Promise.all(pending.map(m=>{
    const prior=priorSummaryFor(m.email,classId,t);
    return db.collection("assignments").add({teacherUid:AUTH.uid,teacherEmail:AUTH.email,teacherName:AUTH.name,studentEmail:m.email,studentName:m.name,subject:c.subject,language:c.language||"English",prevGrade:c.prevGrade,curGrade:c.curGrade,classId:classId,className:c.name,term:t,publishDate:td[t]||"",prior:prior||null,customQuestions:(c.diagQuestions&&c.diagQuestions.length?c.diagQuestions:null),customTitle:(c.diagTitle||null),genNonce:freshNonce,status:"pending",createdAt:Date.now()}).catch(()=>{});
  })).then(()=>{ S.classTerm=t; render(); });
}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fmtDate(s){ if(!s)return ""; const dt=new Date(s+"T00:00:00"); return isNaN(dt)?s:dt.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function aTerm(a){return String((a&&a.term)||"1");}
function isPublished(a){ return !a.publishDate || a.publishDate<=todayISO(); }
function classCompleted(id,term){return assignments().filter(a=>a.classId===id&&a.status==="completed"&&(!term||aTerm(a)===String(term)));}
function classSkillAvg(id,term){
  const c=classesList().find(x=>x.id===id); if(!c)return {};
  const done=classCompleted(id,term), areas=skillsFor(c.subject), out={};
  areas.forEach(k=>{let s=0,n=0;done.forEach(a=>{const v=(a.skillPct||{})[k];if(v!=null){s+=v;n++;}});out[k]=n?Math.round(s/n):null;});
  return out;
}
function flaggedFor(id,term){
  const done=classCompleted(id,term); if(!done.length)return [];
  const sorted=done.slice().sort((a,b)=>(a.score||0)-(b.score||0));
  const bottomN=Math.max(1,Math.ceil(done.length*0.3)), bottomIds={};
  sorted.slice(0,bottomN).forEach(a=>bottomIds[a.id]=true);
  return done.filter(a=>(a.score||0)<80 || bottomIds[a.id]).map(a=>{
    const reasons=[];
    if((a.score||0)<80)reasons.push("Below grade level");
    if(bottomIds[a.id])reasons.push("Bottom 30% of class");
    return Object.assign({_reasons:reasons},a);
  });
}
function computeGoalsFor(a){
  if(a.goals&&a.goals.length)return a.goals;
  const areas=skillsFor(a.subject), sp=a.skillPct||{};
  const focus=areas.filter(k=>sp[k]!=null&&sp[k]<80).sort((x,y)=>(sp[x]||0)-(sp[y]||0)).slice(0,4);
  return focus.map(k=>{const b=sp[k]||0;const t1=Math.min(90,Math.max(b+15,55)),t2=Math.min(95,Math.max(t1+10,65)),t3=Math.min(98,Math.max(t2+10,75));return {skill:k,baseline:b,t1:t1,t2:t2,t3:t3,statement:`Improve ${k} from ${b}% to ${t3}% across the three terms.`};});
}

function openCompleted(id){
  const a=assignments().find(x=>x.id===id); if(!a)return;
  if(!a.snapshot){ alert("No saved results for this diagnostic yet."); return; }
  S=Object.assign(freshState(), JSON.parse(JSON.stringify(a.snapshot)));
  if(!S.taskDone)S.taskDone={};
  S.activeAssignment=id; S.activeTab="results";
  save(); render();
}
function openAssignment(id,completed){
  const a=assignments().find(x=>x.id===id); if(!a)return;
  if(completed){ showAssignmentResult(id); return; }
  if(a.status==="completed" && !a.retakeAllowed){ alert("You've already completed this diagnostic. Ask your teacher to allow a retake."); return; }
  if(a.status!=="completed" && !isPublished(a)){ alert("This diagnostic opens on "+fmtDate(a.publishDate)+"."); return; }
  S.activeAssignment=id;
  S.student={name:AUTH.name,subject:a.subject,prevGrade:a.prevGrade,curGrade:a.curGrade,language:a.language||"English",genNonce:a.genNonce||0};
  S.prior=a.prior||null; S.curTerm=a.term||"1";
  S.customQuestions=a.customQuestions||null; S.customTitle=a.customTitle||null;
  // Retake = RESUME where the student left off. The paper regenerates identically from
  // the same seed (genNonce unchanged), so the saved answers still line up by question
  // index. Restore them (and any written response) instead of wiping the attempt.
  var snap=a.snapshot&&a.snapshot.result;
  var priorAns = (a.status==="completed") ? (a.answers || (snap&&snap.answers) || {}) : {};
  var priorWrite = (a.status==="completed") ? (a.writeResponse || (snap&&snap.writeResponse) || "") : "";
  S.answers=Object.assign({},priorAns);S.result=null;S.plan=null;S.taskDone={};S.writeResponse=priorWrite;S.activeTab="diagnostic";
  save(); render(); lockdownStart("diagnostic");
}

function saveStudent(){
  const name=document.getElementById("f_name").value.trim();
  const subject=document.getElementById("f_subject").value;

  if(changed){S.answers={};S.result=null;S.plan=null;S.taskDone={};S.writeResponse="";}

}

function writingAssess(text){

  var linkers=["however","because","therefore","first","second","finally","also","for example","in addition","although","moreover","as a result","in conclusion","on the other hand","furthermore","meanwhile","since ","while ","but ","so "];
  var lc=" "+text.toLowerCase()+" ";

  var uniq={}; words.forEach(function(w){uniq[w.toLowerCase().replace(/[^a-z']/g,"")]=1;}); delete uniq[""];
  var uc=Object.keys(uniq).length; var lexDiv= wc? uc/wc : 0;
  var Task=Math.round(Math.min(100, wc/120*100));                                  // ~120 words = full task length
  var Coh=Math.round(Math.min(100, (Math.min(sentences,6)/6*60) + Math.min(transCount,4)/4*40));
  var Vocab=Math.round(Math.min(100, (lexDiv/0.55*100) * Math.min(1, wc/30)));      // range, damped for very short texts
  var mech=0; if(/^[A-Z]/.test(text))mech+=30; if(/[.!?]$/.test(text))mech+=25; if(!/\bi\b/.test(text)||/\bI\b/.test(text))mech+=20; if(sentences>=2)mech+=25;

  return {pct:pct,cefr:cefrFromPct(pct),words:wc,
    bands:{"Task & content":Task,"Coherence & cohesion":Coh,"Vocabulary range":Vocab,"Grammar & mechanics":Mech},
    note:"Auto-estimated from length, organisation, vocabulary range and mechanics. Please confirm against the full CEFR rubric."};
}

function grade(force){
  if(READONLY) return;
  if(S.result){ S.activeTab="results"; save(); render(); return; }
  const qs=getQuestions();
  const unanswered=qs.filter((q,i)=>S.answers[i]==null).length;
  // Normal submit requires every question answered. A forced submit (integrity
  // kick-out) grades whatever is there and scores the rest as incorrect.
  if(unanswered>0 && !force){ alert("Please answer all "+qs.length+" questions before submitting. You still have "+unanswered+" left."); return; }
  const subj=S.student.subject, areas=skillsFor(subj);
  const per={}; areas.forEach(a=>per[a]={correct:0,total:0});
  let correct=0;
  // Guard against a question whose skill isn't in the subject's skill list (would otherwise
  // throw and abort a forced/kick-out submit, leaving the attempt unrecorded).
  qs.forEach((q,i)=>{ if(!per[q.skill])per[q.skill]={correct:0,total:0}; per[q.skill].total++; if(S.answers[i]===q.answer){correct++;per[q.skill].correct++;} });
  const overallPct=Math.round(correct/qs.length*100);
  const skillPct={}; areas.forEach(a=>{ skillPct[a]= per[a].total? Math.round(per[a].correct/per[a].total*100):0; });
  let writingProvisional=null, writingAssessObj=null;
  if(subj==="English"){ const wr=(S.writeResponse||"").trim(); writingAssessObj=writingAssess(wr); if(wr){ writingProvisional=writingAssessObj.pct; skillPct["Writing"]=writingProvisional; } }
  // Classify the student as a Low / Medium / High achiever from performance across the
  // Foundational / Core / Challenge difficulty bands (the core purpose of the diagnostic).
  const achiever=computeAchiever(qs, S.answers);
  S.result={ when:new Date().toISOString(), overallPct, correct, total:qs.length, skillPct, per, level:levelFromPct(overallPct), achiever:achiever, terminated:!!force };
  S.result.writePrompt=(subj==="English")?(writingPromptRot(S.student.prevGrade,S.curTerm,studentNonce())||null):null;
  S.result.writeResponse=S.writeResponse||"";
  S.result.writingProvisional=writingProvisional;
  S.result.writingAssess=writingAssessObj;
  // Save answers + a question snapshot so the teacher can download a marked PDF later (keep the difficulty level).
  S.result.answers=Object.assign({},S.answers);
  S.result.qsnapshot=qs.map(function(q){return {q:q.q,options:q.options,answer:q.answer,skill:q.skill,sub:q.sub||null,level:q.level||null};});
  S.result.passageTitle=(subj==="English")?(readingCompRot(S.student.prevGrade,S.curTerm,studentNonce())||{}).title||null:null;
  S.plan=generatePlan();
  lockdownEnd();
  S.activeTab="results"; save(); render();
}

function generatePlan(){
  const subj=S.student.subject, areas=skillsFor(subj);
  const gaps=areas.filter(a=>S.result.skillPct[a]<55);
  let focus = gaps.length?gaps:areas.slice();
  if(S.prior&&S.prior.skillPct){ areas.forEach(a=>{ if(S.prior.skillPct[a]!=null && S.prior.skillPct[a]<55 && focus.indexOf(a)<0) focus.push(a); }); }
  // UAE calendar: Term 1 runs ~17 weeks with 7 practice folders per week; Terms 2 & 3 are shorter.
  const WEEKS_BY_TERM={ "1":17, "2":10, "3":10 };
  const TASKS_BY_TERM={ "1":7, "2":5, "3":5 };
  const terms={};
  ["1","2","3"].forEach((t,ti)=>{
    const WEEKS=WEEKS_BY_TERM[t], NT=TASKS_BY_TERM[t];
    const weeks=[];
    for(let w=1;w<=WEEKS;w++){
      const skill=focus[(w-1)%focus.length];
      const lib=ACTIVITY_LIB[skill]||["Practice activity"];
      const L=lib.length; const base=((ti*20)+(w-1))*NT;
      const tasks=[]; for(let k=0;k<NT;k++){ tasks.push(lib[(base+k)%L]); }
      weeks.push({week:w,skill,tasks});
    }
    terms[t]={ goal:`By end of Term ${t}: raise ${focus.join(", ")} toward grade-level mastery (target ${60+ti*10}%+).`, weeks };
  });
  const goals=focus.map(a=>{
    const b=S.result.skillPct[a]||0;
    const t1=Math.min(90,Math.max(b+15,55)), t2=Math.min(95,Math.max(t1+10,65)), t3=Math.min(98,Math.max(t2+10,75));
    return {skill:a, baseline:b, t1:t1, t2:t2, t3:t3,
      statement:`Improve ${a} from ${b}% to ${t3}% (grade-level) by year-end — term targets ${t1}% → ${t2}% → ${t3}%.`};
  });
  return {focus,termWeeks:WEEKS_BY_TERM,terms,goals,createdFrom:S.result.when};
}

  if(!goals.length) return `<div class="card"><h2>My Goals</h2><div class="empty"><div class="big">🎯</div>No gap areas were flagged in your diagnostic — keep up the great work! Goals appear here automatically when there are skills to lift.</div></div>`;
  function skillPlanPct(sk){let d=0,tt=0;["1","2","3"].forEach(t=>S.plan.terms[t].weeks.forEach(w=>{if(w.skill===sk)w.tasks.forEach((_,i)=>{tt++;if(S.taskDone[t+"-"+w.week+"-"+i])d++;});}));return tt?Math.round(d/tt*100):0;}
  const cards=goals.map(g=>{
    const eff=skillPlanPct(g.skill);

      <p class="muted" style="font-size:12px;margin-top:10px">Your activities to reach this goal are in <b>Weekly Folders</b> — open the ${g.skill} weeks and tap <b>▶ Practice</b>.</p>

  return `<div class="card"><h2>My Goals</h2><p class="sub">Set automatically from your diagnostic. Reach each target by completing the matching activities in your weekly plan.</p></div>${cards}`;

function termProgress(t){
  const p=S.plan;let total=0,done=0;
  p.terms[t].weeks.forEach(w=>w.tasks.forEach((_,i)=>{total++;if(S.taskDone[`${t}-${w.week}-${i}`])done++;}));
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function viewTracker(){
  const p=S.plan;

  const totalDone=t1.done+t2.done+t3.done, totalAll=t1.total+t2.total+t3.total;
  const yearPct=totalAll?Math.round(totalDone/totalAll*100):0;
  const terms=[{k:"1",d:t1},{k:"2",d:t2},{k:"3",d:t3}];
  const planTarget=[100,100,100];
  const chart=`<div class="chartwrap">${terms.map((x,i)=>`
    <div class="colbar"><span style="font-size:11px;font-weight:700">${x.d.pct}%</span>

  let skillBreak = p.focus.map(f=>{
    let d=0,tt=0;
    ["1","2","3"].forEach(t=>p.terms[t].weeks.forEach(w=>{if(w.skill===f)w.tasks.forEach((_,i)=>{tt++;if(S.taskDone[`${t}-${w.week}-${i}`])d++;});}));
    const pct=tt?Math.round(d/tt*100):0;
    return `<tr><td><b>${f}</b></td><td>${S.result.skillPct[f]}%</td>
      <td style="width:40%"><div class="bar"><span style="width:${pct}%"></span></div></td><td>${pct}%</td>
      <td><span class="pill ${pct>=60?"green":pct>0?"amber":"grey"}">${pct>=60?"Improving":pct>0?"Started":"Not started"}</span></td></tr>`;
  }).join("");
  return `<div class="card"><h2>Progress Tracker</h2><p class="sub">Achievement across each term and the full year, against the development plan.</p>

      <div class="box"><div class="n">${yearPct}%</div><div class="l">Year completion</div></div>

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt", e=>{
  e.preventDefault(); deferredPrompt=e;
  const b=document.getElementById("installBtn"); if(b) b.style.display="inline-block";
});
var ib=document.getElementById("installBtn");
if(ib) ib.addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt=null; ib.style.display="none";
});
window.addEventListener("appinstalled", ()=>{ const b=document.getElementById("installBtn"); if(b)b.style.display="none"; });
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  // Reload once when a new service worker takes control, so a stale cached build is replaced
  // immediately with the latest code (fixes students stuck on an old version whose submissions
  // didn't save per-question answers).
  let _swReloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(_swReloaded)return; _swReloaded=true; location.reload(); });
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      try{ reg.update(); }catch(_){}
      // If an updated worker is waiting, activate it now.
      if(reg.waiting){ try{ reg.waiting.postMessage("skip"); }catch(_){} }
      reg.addEventListener("updatefound", ()=>{ const nw=reg.installing; if(nw){ nw.addEventListener("statechange", ()=>{ /* controllerchange handles reload */ }); } });
    }).catch(()=>{});
    // Check for an updated worker each time the app regains focus.
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{try{r.update();}catch(_){}})); } });
    // AND poll on a timer. A student sitting in the fullscreen locked test never fires
    // visibilitychange, so without this a freshly-deployed fix would never reach them.
    // Every 25s we ask the browser to re-check sw.js; if it changed, the new worker activates,
    // controllerchange fires, and the page reloads once (answers are saved in localStorage, so
    // they survive the reload and the lockdown counter simply restarts at zero — no violation).
    setInterval(function(){ try{ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{try{r.update();}catch(_){}})); }catch(_){}}, 25000);
  });
}

fbAuth.onAuthStateChanged(function(user){
  _unsub.forEach(u=>{try{u()}catch(e){}}); _unsub=[];
  if(!user){ AUTH=null; CACHE={assignments:[],classes:[],tests:[]}; S=freshState(); render(); return; }
  db.collection("users").doc(user.uid).get().then(doc=>{
    AUTH=Object.assign({uid:user.uid,email:(user.email||"").toLowerCase()}, doc.exists?doc.data():{role:"student",name:user.email});
    CACHE={assignments:[],classes:[],tests:[]};
    startListeners();
    if(AUTH.role==="student") loadStateForUser();
    render();
  }).catch(e=>{ console.warn(e); render(); });
});
render();
</script>
</body>
</html>
